name: Build and Archive

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fast-woo-order-lookup
          path: .
          compression-level: 9
